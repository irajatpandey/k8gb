apiVersion: k8gb.io/v1beta1
kind: Gslb
metadata:
  name: valid-hostname
  namespace: ($namespace)
  annotations:
    k8gb.io/exposed-hostnames: "node1.example.com"
spec:
  ingress:
    ingressClassName: nginx
    rules:
    - host: valid-hostname.cloud.example.com
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: frontend-podinfo
              port:
                name: http
  strategy:
    type: roundRobin
    dnsTtlSeconds: 5
